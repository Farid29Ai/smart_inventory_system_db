      .tiny { fill: #94A3B8; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .screenTitle { fill: #FFFFFF; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 30px; font-weight: 900; }
